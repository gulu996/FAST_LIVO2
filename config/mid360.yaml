time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 2
  filter_size_surf: 0.25
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 4
  blind: 0.5

vio:
  max_iterations: 5 # 提高视觉EKF迭代次数，优先把可用帧跑起来
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  visual_map_prune_en: true
  visual_map_max_voxels: 1800 # 视觉体素硬上限；到上限后淘汰最早的非当前子图体素
  visual_map_max_points_per_voxel: 10 # 每个视觉体素最多保留点数；满后用新点替换更早的点
  visual_map_max_total_points: 20000 # 视觉点总量硬上限；满后按frame id淘汰最早的点
  visual_map_max_add_per_frame: 300 # 控制单帧新增点数量，适合Jetson长时间运行
  visual_map_min_shi_tomasi_score: 8.0 # 提高角点质量阈值，低质量纹理不轻易加入视觉地图
  min_retrieve_points: 30 # 至少跟踪到足够视觉点才进入视觉EKF，坏图/低纹理帧尽量跳过
  min_update_meas: 500 # 提高视觉残差数量门限，观测太少时只检索/建图，不更新状态
  low_track_force_update_stride: 0 # 关闭低跟踪强制VIO，避免坏图像靠少量点硬更新
  low_track_force_min_points: 12 # 备用参数；low_track_force_update_stride=0时不生效
  visual_update_guard_en: true # 视觉EKF总修正门限，超过则回滚到LIO/IMU预测，防止出口过曝导致突然倒退
  visual_update_max_trans_m: 0.12 # 收紧单帧视觉总平移修正上限，坏图导致的大跳变会回滚
  visual_update_max_rot_deg: 2.0 # 收紧单帧视觉总旋转修正上限
  visual_update_max_backward_m: 0.01 # 视觉更新后的最终位姿相对上一帧允许的反向步长硬上限，不限制VIO正常回拉LIO超前
  visual_update_max_backward_ratio: 0.08 # 最终位姿反向步长不能超过当前帧预测前进距离的比例
  visual_update_backward_abs_floor_m: 0.003 # 最终位姿反向步长动态阈值下限，避免低速时过度敏感
  visual_update_max_lateral_m: 0.08 # 垂直于速度方向的视觉修正硬上限
  visual_update_max_lateral_ratio: 0.35 # 横向修正不能超过当前帧预测前进距离的比例
  visual_update_max_exposure_delta: 0.30 # 曝光估计突变较大时回滚视觉更新
  image_quality_gate_en: true # 打开整帧质量门，过曝/过暗/低对比图像直接跳过VIO更新
  image_quality_max_saturated_fraction: 0.10 # 全图过曝比例超过该值时跳过VIO
  image_quality_max_tile_saturated_fraction: 0.25 # 局部区域过曝严重时跳过VIO，适合隧道出口强光
  image_quality_max_dark_fraction: 0.95 # 灰度<=阈值的像素比例超过该值认为画面近乎全黑
  image_quality_min_intensity_std: 10.0 # 灰度标准差低于该值认为低纹理/低对比
  visual_patch_quality_gate_en: true # 对单个视觉patch做过曝/低纹理过滤，处理出口刚出现时面积小、全图门限尚未触发的纯白区域
  visual_patch_max_saturated_fraction: 0.10 # patch内过曝过多时不参与跟踪/建图
  visual_patch_min_intensity_std: 4.0 # patch灰度标准差过低时不参与跟踪/建图
  image_quality_saturated_pixel_value: 245 # 更早识别接近过曝的像素
  image_quality_dark_pixel_value: 8
  image_quality_tile_rows: 6 # 更细的分块，更容易发现局部强光坏区
  image_quality_tile_cols: 6
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.8 # 0.2
  gyr_cov: 0.5 # 0.5
  b_acc_cov: 0.001 # 0.1
  b_gyr_cov: 0.001 # 0.1

uwb:
  enable: true
  update_en: true
  residual_debug_only: false
  update_xy_only: true
  use_3d_range_model: true
  update_z: false
  update_orientation: false
  min_anchors: 2
  min_anchors_for_update: 2
  prefer_anchors: 3
  range_noise_m: 0.10
  max_residual_rms: 0.50
  max_xy_correction_normal: 0.50
  normal_update_max_xy_raw: 0.50
  max_update_step_xy: 0.05
  max_time_diff: 0.05
  two_anchor_sigma_scale: 5.0
  single_anchor_corridor_1d_en: true
  single_anchor_only_when_total_anchors_eq_2: true
  single_anchor_requires_baseline_initialized: true
  two_anchor_update_mode: "baseline_1d_direct" # dry_run / baseline_1d / baseline_1d_direct / weak_xy
  two_anchor_alpha: 0.05
  two_anchor_normal_max_step: 0.05
  two_anchor_degraded_max_step: 0.10
  two_anchor_strong_degraded_max_step: 0.15
  two_anchor_hard_max_step: 0.20
  two_anchor_max_residual: 2.0
  baseline_1d_direct_alpha: 0.05
  baseline_1d_direct_max_step_m: 0.03
  two_anchor_baseline_consistency_threshold_m: 2.0
  baseline_consistency_threshold: 2.0
  two_anchor_max_residual_rms: 0.8
  two_anchor_max_abs_residual: 1.5
  single_anchor_alpha: 0.05
  single_anchor_normal_max_step: 0.05
  single_anchor_degraded_max_step: 0.10
  single_anchor_strong_degraded_max_step: 0.15
  single_anchor_hard_max_step: 0.20
  single_anchor_max_residual: 2.0
  single_anchor_confirm_count: 2
  single_anchor_min_range: 1.0
  single_anchor_max_range: 60.0
  single_anchor_branch_margin: 0.5
  single_anchor_near_anchor_disable_dist: 1.0
  single_anchor_range_jump_threshold: 2.0
  single_anchor_residual_jump_threshold: 1.0
  single_anchor_speed_threshold: 2.0
  corridor_direction_max_angle_deg: 30.0
  disable_single_anchor_on_turn: true
  enable_corridor_segments: false
  degraded_mode_en: true
  degraded_confirm_count: 3
  strong_degraded_confirm_count: 5
  multi_anchor_max_residual_rms: 0.8
  multi_anchor_max_abs_residual: 1.5
  limited_update_max_residual_rms: 2.0
  limited_update_max_abs_residual: 3.0
  limited_update_max_xy_raw: 3.0
  limited_update_max_time_diff_s: 0.05
  limited_update_require_consecutive_good: 2
  relocalization_candidate_min_xy_raw: 1.5
  relocalization_en: false
  relocalization_threshold: 1.5
  relocalization_confirm_count: 5
  uwb_only_max_residual_rms: 0.5
  uwb_only_max_abs_residual: 1.0
  uwb_position_jump_threshold: 1.0
  uwb_speed_threshold: 2.0
  hard_reject_xy_raw: 3.0
  require_consecutive_good_updates: 3
  good_residual_rms: 0.30
  suspect_hold_en: false
  lost_hold_en: false
  large_correction_warn_threshold: 0.50
  large_correction_reject_threshold: 3.0

  # 数据来源：serial在线读串口；file离线从replay_file回放之前保存的uwb_ranges.txt
  source: "file" # serial在线读串口；file离线从replay_file读之前保存的uwb_ranges.txt
  replay_file: "/home/gulu/Downloads/uwb/uwb_ranges3.txt"
  replay_start_offset_s: -85.0 # file模式: +x表示rosbag播放x秒后开始UWB；-x表示跳过UWB开头x秒并把UWB的x秒处对齐rosbag开头
  replay_match_threshold_s: 0.05 # file模式: 按LiDAR/SLAM相对时间匹配UWB，abs(slam_relative-uwb_relative)小于该值才使用

  # 模式选择：
  # entry_exit_distance ：入口/出口各一个模块，只需要填写 entry_exit_distance_m
  # external_anchors ：多基站且已知外部坐标，填写下面 anchors 的 flag=1 和 position
  mode: "external_anchors"
  anchor_frame_align_en: true # false: anchors.position就是FAST-LIVO world坐标；true: 估计外部UWB坐标到FAST-LIVO的变换。true且只有2个有效anchor时自动使用基线模式。

  #两个基站时使用，从entry_anchor_id沿基线走向exit_anchor_id，单位米
  entry_anchor_id: 1
  exit_anchor_id: 0
  # mode=external_anchors时使用。anchor_frame_align_en=false时，position就是FAST-LIVO坐标系下的坐标；
  # anchor_frame_align_en=true且有效anchor>=3时，position是外部UWB坐标，程序会用多时刻/多anchor range residual估计yaw+tx+ty。
  # anchor_frame_align_en=true且只有2个有效anchor时，程序使用两基站基线模式：你需要从entry_anchor_id沿基线走向exit_anchor_id。
  anchors:
    - id: 0
      flag: 1 # external_anchors模式设为1，并填写外部坐标；entry_exit_distance模式保持0即可
      position: [44.2, 5.8, 0.285]
    - id: 1
      flag: 1
      position: [-0.52, -0.64, 0.2]
    - id: 2
      flag: 0
      position: [57.76, 44.2927, 0.0]
    - id: 3
      flag: 0
      position: [0.161242, 42.1851, 0.0]

  # 常用调参
  tag_offset_body: [0.0, 0.0, 0.0] # UWB天线相对IMU/body坐标系的位置
  init_min_motion_m: 30.0 # 估计入口-出口方向前至少运动的距离；有明显横移时可增大
  position_cov_floor_m: 0.0 # 正常场景不固定抬高UWB权重；退化时使用下面的degraded floor
  position_cov_floor_degraded_m: 3.0
  position_cov_floor_degraded_only: true
  output_correction_en: false # debug-only；默认UWB直接更新内部EKF state的xy，不走output_offset轨迹修正
  output_smooth_en: true # true: UWB输出修正按帧平滑过渡，避免轨迹突然折线跳变
  output_smooth_alpha: 0.15 # 每帧向UWB目标修正量靠近的比例，越大越跟手，越小越平滑
  output_smooth_max_step_m: 0.05 # 每帧输出修正量最大变化，建议0.03~0.10；越小轨迹越平滑但收敛更慢
  pause_map_update_threshold: 0.05
  pause_map_update_frames_default: 3
  pause_map_update_frames: 3
  pause_map_update_min_correction_m: 0.05
  max_residual_m: 6.0

  # 高级参数：通常不需要修改
  serial_port: "/dev/ttyUSB0"
  baudrate: 115200
  dtr: true
  rts: false
  log_filename: "uwb_ranges.txt" # 保存到当前save_path时间戳目录下
  log_flush_stride: 1 # 每几行刷新一次，1表示便于tail -f实时观察
  parser_mode: "distance" # 只识别distance[id],dist；UWBDBG可能重复打印上一次成功结果，默认不参与回放
  range_scale: 1.0 # 串口里若是cm填0.01，若是mm填0.001
  min_range_m: 0.05
  max_range_m: 250.0 # 入口/出口基站相距178m，远端测距不能用100m门限提前丢弃
  max_age_s: 5.0 # 离线relative倍速回放时允许少量调度滞后，避免误丢UWB replay数据
  max_queue_size: 512
  stale_repeat_filter_en: true # 同一anchor距离长时间完全不变时视为失联后缓存值，不参与更新
  stale_repeat_epsilon_m: 0.001 # 距离相差小于该值认为重复；当前UWB输出到毫米，0.001较合适
  stale_repeat_max_count: 3 # 允许UWBDBG和distance行造成的少量重复
  stale_repeat_max_duration_s: 2.0 # 重复持续超过该时间后开始丢弃
  update_max_rot_step_deg: 1.0
  update_max_trans_step_m: 0.20 # output_correction_en=true时可适当增大；只修正输出轨迹，不会直接破坏局部地图
  tag_offset_estimate_en: false # 可选在线估计UWB天线杆臂；需要anchor世界坐标有效且运动/观测充分
  tag_offset_estimate_min_anchors: 2
  tag_offset_init_cov_m: 0.10
  tag_offset_process_noise_m: 0.0 # 刚性安装建议为0；非0会允许杆臂缓慢变化
  tag_offset_update_max_step_m: 0.01
  tag_offset_max_norm_m: 1.0
  anchor_frame_align_min_motion_m: 20.0 # 自动对齐要求轨迹运动距离，少于该值不估计T_world_uwb
  anchor_frame_align_min_duration_s: 30.0 # 自动对齐至少累计多少秒range数据
  anchor_frame_align_min_ranges: 30 # 自动对齐至少累计多少条有效range
  anchor_frame_align_min_anchors: 3 # 少于3个anchor不允许自动对齐
  anchor_frame_align_success_rms_m: 0.50 # 优化/验证 residual RMS 小于该值才允许成功
  anchor_frame_align_success_max_residual_m: 1.50 # 单条最大残差门限
  anchor_frame_align_validation_duration_s: 5.0 # 自动对齐后继续dry-run验证这么久，验证通过才启用UWB更新
  anchor_frame_align_use_start_range_offset: false # deprecated: 不再用单个start_range确定anchor0位置
  anchor_frame_align_yaw_only: true # 自动对齐只估计yaw+tx+ty，scale=1，z不优化
  anchor_position_estimate_en: false # baseline模式下不再做自由3D anchor估计，避免隧道直线/饱和range导致RMSE爆炸
  anchor_estimate_use_for_update: true
  anchor_estimate_freeze_after_init: true
  anchor_estimate_min_samples: 30
  anchor_estimate_max_samples: 300
  anchor_estimate_min_rank: 1 # 3D充分运动建议3；隧道近似直线可降到1/2，但3D位置会有歧义
  anchor_estimate_min_motion_m: 1.0
  anchor_estimate_max_rmse_m: 2.0
  anchor_estimate_max_step_m: 0.0 # 0表示不限制GN单步，避免几十米外的anchor被2m步长卡住

lio:
  max_iterations: 3
  map_update_stride: 2 # 仅每2帧更新一次地图体素，优先实时定位（可降建图细节）
  icp_min_iterations: 1 # ICP最小迭代次数：至少做1次
  icp_early_stop_residual_ratio: 0.03 # 残差相对改善低于该阈值且已收敛时提前停止
  icp_max_rot_step_deg: 1.2 # ICP单次旋转更新上限（度），抑制异常匹配导致姿态突跳
  icp_max_trans_step_m: 0.20 # ICP单次平移更新上限（米），抑制”轨迹上天”
  dept_err: 0.02
  beam_err: 0.15
  min_eigen_value: 0.005 # 0.005
  voxel_size: 0.8
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 100
  sliding_thresh: 4
  long_term_visual_map_en: false # 关闭长期视觉地图，降低长期运行计算开销
  long_term_visual_max_voxels: 5000 # 长期视觉地图最大体素数，超过后会逐步裁剪以限制内存

adaptive_selector:
  en: false # 离线诊断时先处理每一帧图像，避免视觉地图断点；实时跑不动时再改true
  trans_thresh_min: 0.03
  trans_thresh_max: 0.08
  rot_thresh_min_deg: 0.4
  rot_thresh_max_deg: 1.0
  constraint_ratio_full: 0.2
  max_skip_frames: 1

runtime_guard:
  enable: false # 运行时超时保护开关：true时自动在超预算时降级并在稳定后恢复
  frame_time_budget_s: 0.06 # 预算每帧处理时间不超过多少ms

uav:
  imu_rate_odom: false
  gravity_align_en: true

gps:
  enable: false
  use_gps_position: false
  use_gps_imu: false
  gps_imu_auxiliary_only: true
  primary_imu: "lidar_imu" # LiDAR/雷达IMU是FAST-LIVO2高频传播主IMU；GPS IMU未完成外参、时间同步、噪声和bias模型前仅作辅助检查。

publish:
  dense_map_en: true
  pub_effect_point_en: true  # 已启用特征点可视化
  pub_plane_en: false
  pub_scan_num: 1
  publish_img_stride: 1 # 图像可视化降频
  blind_rgb_points: 0.0

debug:
  print_console_timing_en: true # 终端耗时表输出
  print_console_timing_stride: 1
  vio_console_timing_print_en: true
  vio_console_timing_print_stride: 1

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pos_output:
  enable_timestamp: true
  format: "timestamp_xyz_quat"

pcd_save:
  pcd_save_en: false
  save_log_en: true # 日志写盘
  save_path: "/home/gulu/data"
  global_map_pub: false   #need to set pcd_save_en true, x86上请设为false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.05
  max_cache_points: 40000 # 缓存点云硬上限（RGB或强度）
  interval: 10
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

udp_report:
  en: true
  device_id: "fast_livo2_001"
  target_ip: "127.0.0.1"
  target_port: 9000

aruco_landmarks:
  aruco_landmarks_en: false
  width: 0.8
  height: 0.6
  marker_size: 0.16
  delta_width_qr_center: 0.28 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.18 # Half the distance between the centers of two markers in the vertical direction
  markers:
    - id: 1
      flag: 0      #0表示该地标的世界坐标无效
      #position: [1.0, 2.0, 1.5]
    - id: 2
      flag: 0
      #position: [10.0, 2.0, 1.5]
    - id: 3
