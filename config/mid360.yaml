  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
  sub_lidar_queue_size: 1000
  sub_imu_queue_size: 10000
  sub_img_queue_size: 1000
  max_lidar_buffer_size: 1000
  max_imu_buffer_size: 10000
  max_img_buffer_size: 1000
  max_prop_imu_buffer_size: 10000
  sync_img_buffer_min_size: 5
  sync_img_lookahead_time: 0.12

