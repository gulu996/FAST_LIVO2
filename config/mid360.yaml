common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  #extrinsic_T: [-0.011, -0.02329, 0.04412]
  #extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  #Rcl: [ -0.011008,  -0.999940,   0.000187,
  #        0.539054,  -0.006092,  -0.842250,
  #        0.842200,  -0.009171,   0.539089]
  #Pcl: [  0.086367,  -0.365243,  -0.070319]


  #extrinsic_T: [0.08809, 0.01329, -0.25733]
  #extrinsic_R: [-0.8090170, 0.0000, -0.5877852, 0.0000, -1.0000, 0.0000, -0.5877852, 0.0000, 0.8090170]
  #Rcl: [ -0.023487,  -0.999710,   0.005250,
  #     -0.013503,  -0.004934,  -0.999897,
  #      0.999633,  -0.023556,  -0.013383]
  #Pcl: [ -0.001139,  -0.161932,   0.001251]

  #2600*2160
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [-0.020181 , -0.999125 ,  0.036652 ,
         0.396389 , -0.041651 , -0.917137 ,
         0.917861 , -0.003980 ,  0.396882]
  Pcl: [ 0.051922 , -0.205230 , -0.018727]
 
time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 2
  filter_size_surf: 0.25
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 4
  blind: 0.5

vio:
  max_iterations: 3
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  visual_map_prune_en: true
  visual_map_max_voxels: 1800 # 降低视觉地图规模，优先实时性
  visual_map_max_points_per_voxel: 8 # 每个视觉体素最多保留点数
  visual_map_max_total_points: 18000 # 视觉点总量硬上限
  visual_map_max_add_per_frame: 300 # 每帧最多新增视觉点
  visual_map_min_shi_tomasi_score: 6.0 # 降低角点阈值以提升低纹理场景可用点
  low_track_force_update_stride: 5 # 低跟踪点时每5帧强制尝试一次视觉EKF
  low_track_force_min_points: 6 # 触发强制更新所需的最少跟踪点
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.8 # 0.2
  gyr_cov: 0.5 # 0.5
  b_acc_cov: 0.001 # 0.1
  b_gyr_cov: 0.001 # 0.1

lio:
  max_iterations: 3
  map_update_stride: 2 # 仅每2帧更新一次地图体素，优先实时定位（可降建图细节）
  icp_min_iterations: 1 # ICP最小迭代次数：至少做1次
  icp_early_stop_residual_ratio: 0.03 # 残差相对改善低于该阈值且已收敛时提前停止
  icp_max_rot_step_deg: 1.2 # ICP单次旋转更新上限（度），抑制异常匹配导致姿态突跳
  icp_max_trans_step_m: 0.20 # ICP单次平移更新上限（米），抑制“轨迹上天”
  dept_err: 0.02
  beam_err: 0.15
  min_eigen_value: 0.005 # 0.005
  voxel_size: 0.8
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 55
  sliding_thresh: 4
  long_term_visual_map_en: false # 关闭长期视觉地图，降低长期运行计算开销
  long_term_visual_max_voxels: 5000 # 长期视觉地图最大体素数，超过后会逐步裁剪以限制内存

adaptive_selector:
  en: true # 开启自适应视觉选帧：平移阶段降算力，转向阶段保留视觉约束

runtime_guard:
  enable: true # 运行时超时保护开关：true时自动在超预算时降级并在稳定后恢复
  frame_time_budget_s: 0.06 # 预算每帧处理时间不超过多少ms

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  publish_img_stride: 2 # 图像可视化降频
  blind_rgb_points: 0.0

debug:
  print_console_timing_en: true # 终端耗时表输出
  print_console_timing_stride: 1
  vio_console_timing_print_en: true
  vio_console_timing_print_stride: 1

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: true 
  save_log_en: true # 日志写盘
  save_path: "/home/jetson/data"
  global_map_pub: true   #need to set pcd_save_en true, x86上请设为false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.05
  max_cache_points: 40000 # 缓存点云硬上限（RGB或强度）
  interval: 20
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

aruco_landmarks:
  aruco_landmarks_en: false
  width: 0.8
  height: 0.6
  marker_size: 0.16
  delta_width_qr_center: 0.28 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.18 # Half the distance between the centers of two markers in the vertical direction
  markers:
    - id: 1
      flag: 0      #0表示该地标的世界坐标无效
      #position: [1.0, 2.0, 1.5]
    - id: 2
      flag: 0
      #position: [10.0, 2.0, 1.5]
    - id: 3
      flag: 0
      #position: [20.0, 2.0, 1.5]
    - id: 4
      flag: 0
      #position: [30.0, 2.0, 1.5]
    

