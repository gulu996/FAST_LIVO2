  Pcl: [ 0.051922 , -0.205230 , -0.018727]
 
time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 2
  filter_size_surf: 0.25
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 4
  blind: 0.5

vio:
  max_iterations: 5 # 提高视觉EKF迭代次数，优先把可用帧跑起来
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  visual_map_prune_en: true
  visual_map_max_voxels: 1800 # 降低视觉地图规模，优先实时性
  visual_map_max_points_per_voxel: 10 # 每个视觉体素最多保留点数
  visual_map_max_total_points: 20000 # 视觉点总量硬上限
  visual_map_max_add_per_frame: 500 # 提高每帧可新增视觉点数，帮助更快建立可跟踪地图
  visual_map_min_shi_tomasi_score: 4.0 # 进一步放宽角点阈值，优先让视觉点数量上来
  min_retrieve_points: 10 # 尽量不跳过视觉EKF，只在极低点数时退回建图
  min_update_meas: 300 # 降低残差下限，让少量特征也能真正进入EKF更新
  low_track_force_update_stride: 1 # 低跟踪时每帧都尝试强制视觉EKF
  low_track_force_min_points: 10 # 至少10个可用点就尝试更新；与min_update_meas保持一致
  deterministic_visual_update_en: true # 固定视觉更新为确定性顺序，避免多次回放同一bag因并行归约/等分选择产生不同轨迹
  visual_update_guard_en: true # 视觉EKF总修正门限，超过则回滚到LIO/IMU预测，防止出口过曝导致突然倒退
  visual_update_max_trans_m: 0.20 # 放宽单帧视觉总平移修正上限，减少不必要回滚
  visual_update_max_rot_deg: 4.0 # 放宽单帧视觉总旋转修正上限
  visual_update_max_backward_m: 0.03 # 放宽沿速度反方向的视觉修正上限，但仍保留基本防倒退
  visual_update_max_exposure_delta: 0.50 # 放宽曝光估计单帧变化上限，避免轻微曝光跃迁直接回滚
  image_quality_gate_en: false # 关闭整帧硬拒绝，保留patch级过滤和视觉EKF回滚保护
  image_quality_max_saturated_fraction: 0.20 # 全图过曝比例阈值；关闭整帧门时作为备用默认
  image_quality_max_tile_saturated_fraction: 0.35 # 局部网格过曝比例阈值；关闭整帧门时作为备用默认
  image_quality_max_dark_fraction: 0.98 # 灰度<=阈值的像素比例超过该值认为画面近乎全黑
  image_quality_min_intensity_std: 6.0 # 灰度标准差低于该值认为低纹理/低对比
  visual_patch_quality_gate_en: true # 对单个视觉patch做过曝/低纹理过滤，处理出口刚出现时面积小、全图门限尚未触发的纯白区域
  visual_patch_max_saturated_fraction: 0.10 # 放宽patch内过曝像素比例阈值，保留局部保护但不过早丢帧
  visual_patch_min_intensity_std: 2.0 # patch灰度标准差过低时不参与跟踪/建图
  image_quality_saturated_pixel_value: 250 # 饱和像素定义放宽到更接近代码默认值
  image_quality_dark_pixel_value: 5
  image_quality_tile_rows: 4 # 减少分块数，避免小面积高亮直接触发整帧拒绝
  image_quality_tile_cols: 4
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.8 # 0.2
  gyr_cov: 0.5 # 0.5
  b_acc_cov: 0.001 # 0.1
  b_gyr_cov: 0.001 # 0.1

lio:
  max_iterations: 3
  map_update_stride: 2 # 仅每2帧更新一次地图体素，优先实时定位（可降建图细节）
  icp_min_iterations: 1 # ICP最小迭代次数：至少做1次
  icp_early_stop_residual_ratio: 0.03 # 残差相对改善低于该阈值且已收敛时提前停止
  icp_max_rot_step_deg: 1.2 # ICP单次旋转更新上限（度），抑制异常匹配导致姿态突跳
  icp_max_trans_step_m: 0.20 # ICP单次平移更新上限（米），抑制”轨迹上天”
  deterministic_lio_update_en: true # 固定LIO更新为确定性顺序，禁能BuildResidualListOMP的OpenMP并行以保证确定性
  dept_err: 0.02
  beam_err: 0.15
  min_eigen_value: 0.005 # 0.005
  voxel_size: 0.8
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 100
  sliding_thresh: 4
  long_term_visual_map_en: false # 关闭长期视觉地图，降低长期运行计算开销
  long_term_visual_max_voxels: 5000 # 长期视觉地图最大体素数，超过后会逐步裁剪以限制内存

adaptive_selector:
  en: true # 启用自适应选帧

runtime_guard:
  enable: false # 运行时超时保护开关：true时自动在超预算时降级并在稳定后恢复
  frame_time_budget_s: 0.06 # 预算每帧处理时间不超过多少ms

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: true  # 已启用特征点可视化
  pub_plane_en: false
  pub_scan_num: 1
  publish_img_stride: 1 # 图像可视化降频
  blind_rgb_points: 0.0

debug:
  print_console_timing_en: true # 终端耗时表输出
  print_console_timing_stride: 1
  vio_console_timing_print_en: true
  vio_console_timing_print_stride: 1

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  save_log_en: true # 日志写盘
  save_path: "/home/jeton/data"
  global_map_pub: false   #need to set pcd_save_en true, x86上请设为false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.05
  max_cache_points: 40000 # 缓存点云硬上限（RGB或强度）
  interval: 10
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

udp_report:
  en: true
  device_id: "fast_livo2_001"
  target_ip: "127.0.0.1"
  target_port: 9000

aruco_landmarks:
  aruco_landmarks_en: false
  width: 0.8
  height: 0.6
  marker_size: 0.16
  delta_width_qr_center: 0.28 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.18 # Half the distance between the centers of two markers in the vertical direction
  markers:
    - id: 1
      flag: 0      #0表示该地标的世界坐标无效
      #position: [1.0, 2.0, 1.5]
    - id: 2
      flag: 0
      #position: [10.0, 2.0, 1.5]
    - id: 3
      flag: 0
      #position: [20.0, 2.0, 1.5]
    - id: 4
      flag: 0
      #position: [30.0, 2.0, 1.5]
    
