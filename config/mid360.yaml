time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 2
  filter_size_surf: 0.25
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 4
  blind: 0.5

vio:
  max_iterations: 5 # 提高视觉EKF迭代次数，优先把可用帧跑起来
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  visual_map_prune_en: true
  visual_map_max_voxels: 1800 # 视觉体素硬上限；到上限后淘汰最早的非当前子图体素
  visual_map_max_points_per_voxel: 10 # 每个视觉体素最多保留点数；满后用新点替换更早的点
  visual_map_max_total_points: 20000 # 视觉点总量硬上限；满后按frame id淘汰最早的点
  visual_map_max_add_per_frame: 300 # 控制单帧新增点数量，适合Jetson长时间运行
  visual_map_min_shi_tomasi_score: 8.0 # 提高角点质量阈值，低质量纹理不轻易加入视觉地图
  min_retrieve_points: 30 # 至少跟踪到足够视觉点才进入视觉EKF，坏图/低纹理帧尽量跳过
  min_update_meas: 500 # 提高视觉残差数量门限，观测太少时只检索/建图，不更新状态
  low_track_force_update_stride: 0 # 关闭低跟踪强制VIO，避免坏图像靠少量点硬更新
  low_track_force_min_points: 12 # 备用参数；low_track_force_update_stride=0时不生效
  visual_update_guard_en: true # 视觉EKF总修正门限，超过则回滚到LIO/IMU预测，防止出口过曝导致突然倒退
  visual_update_max_trans_m: 0.12 # 收紧单帧视觉总平移修正上限，坏图导致的大跳变会回滚
  visual_update_max_rot_deg: 2.0 # 收紧单帧视觉总旋转修正上限
  visual_update_max_backward_m: 0.01 # 视觉更新后的最终位姿相对上一帧允许的反向步长硬上限，不限制VIO正常回拉LIO超前
  visual_update_max_backward_ratio: 0.08 # 最终位姿反向步长不能超过当前帧预测前进距离的比例
  visual_update_backward_abs_floor_m: 0.003 # 最终位姿反向步长动态阈值下限，避免低速时过度敏感
  visual_update_max_lateral_m: 0.08 # 垂直于速度方向的视觉修正硬上限
  visual_update_max_lateral_ratio: 0.35 # 横向修正不能超过当前帧预测前进距离的比例
  visual_update_max_exposure_delta: 0.30 # 曝光估计突变较大时回滚视觉更新
  image_quality_gate_en: true # 打开整帧质量门，过曝/过暗/低对比图像直接跳过VIO更新
  image_quality_max_saturated_fraction: 0.10 # 全图过曝比例超过该值时跳过VIO
  image_quality_max_tile_saturated_fraction: 0.25 # 局部区域过曝严重时跳过VIO，适合隧道出口强光
  image_quality_max_dark_fraction: 0.95 # 灰度<=阈值的像素比例超过该值认为画面近乎全黑
  image_quality_min_intensity_std: 10.0 # 灰度标准差低于该值认为低纹理/低对比
  visual_patch_quality_gate_en: true # 对单个视觉patch做过曝/低纹理过滤，处理出口刚出现时面积小、全图门限尚未触发的纯白区域
  visual_patch_max_saturated_fraction: 0.10 # patch内过曝过多时不参与跟踪/建图
  visual_patch_min_intensity_std: 4.0 # patch灰度标准差过低时不参与跟踪/建图
  image_quality_saturated_pixel_value: 245 # 更早识别接近过曝的像素
  image_quality_dark_pixel_value: 8
  image_quality_tile_rows: 6 # 更细的分块，更容易发现局部强光坏区
  image_quality_tile_cols: 6
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.8 # 0.2
  gyr_cov: 0.5 # 0.5
  b_acc_cov: 0.001 # 0.1
  b_gyr_cov: 0.001 # 0.1

uwb:
  enable: false # UWB总开关；true才启动串口/文件读取。
  update_en: true # UWB融合开关；true会用测距修正FAST-LIVO状态，调参/看日志时可先关。
  summary_log_en: true # 每次处理先输出一条UWB_RESULT结论。
  debug_log_en: true # 保留门限、更新量和协方差等分类调试日志。
  range_debug_log_en: true # 输出每个基站的UWB_RANGE明细。
  summary_to_console: true # 终端默认只看简洁结论。
  debug_to_console: false # 详细日志默认不刷终端。
  summary_to_file: true # UWB_RESULT写入uwb_updates.txt。
  debug_to_file: true # 即使终端关闭详细日志，文件仍完整保存。
  statistics_log_interval: 20 # 每20次处理输出一次累计统计。
  update_epsilon: 1.0e-8 # 实际位置修正超过该值才算UPDATED。
  source: "file" # file/replay走replay_file；实机串口改成serial并配置serial_port、baudrate。
  serial_port: "/dev/ttyUSB0" # UWB串口设备名；source=file时不使用。
  baudrate: 115200 # UWB串口波特率；source=file时不使用。
  replay_file: "/home/gulu/Downloads/uwb/0709.txt" # 离线UWB测距文件。
  replay_start_offset_s: 1.14 # 回放时间整体平移；正数=延后，负数=跳过前段。
  replay_match_threshold_s: 0.05 # 回放量测与LiDAR帧的最大匹配时间差。
  mode: "external_anchors" # external_anchors=使用anchors坐标；entry_exit_distance=只用出入口基线距离。
  anchor_frame_align_en: true # anchors不在FAST-LIVO世界系时打开，系统会估计UWB锚点坐标系到LIVO系的对齐。
  min_anchors_for_update: 2 # 每次融合至少需要的有效锚点数；2锚只能约束基线方向，3+锚更稳。
  prefer_anchors: 2 # 每次优先选用的锚点数；两锚场景填2，多锚场景可调到3或4。
  range_noise_m: 0.10 # UWB单次测距标准差；测距抖动大就调大，系统会更少相信UWB。
  position_cov_floor_m: 0.0 # 正常模式UWB位置协方差下限；0表示不人为放大。
  position_cov_floor_degraded_m: 0.0 # 明确退化模式下的位置协方差下限；当前诊断阶段保持0。
  position_cov_floor_degraded_only: true # 退化下限只允许在degradation_level非normal时使用。
  max_residual_m: 6.0 # 单个测距残差硬门限，超过直接拒绝。
  max_residual_rms: 0.50 # 多锚残差RMS门限；误差大但仍想跟随时可放宽。
  max_update_step_xy: 0.05 # 单帧XY最大修正量；调大响应快但更容易跳。
  max_time_diff_s: 0.05 # 实时量测与当前LiDAR帧的最大时间差。
  two_anchor_update_mode: "baseline_1d_direct" # 两锚退化场景沿基线做一维直接修正。
  single_anchor_corridor_1d_en: false # 只剩单锚时尝试沿走廊/基线做一维约束。
  single_anchor_only_when_total_anchors_eq_2: true # 仅总锚点数为2时启用单锚退化逻辑。
  entry_anchor_id: 1 # 基线起点锚点ID；两锚/单锚退化逻辑使用。
  exit_anchor_id: 0 # 基线终点锚点ID；两锚/单锚退化逻辑使用。
  anchors:
    - id: 1
      role: entry
      flag: 1 # 1=启用该锚点，0=忽略。
      position: [0.0, 0.0, 0.0] # 锚点坐标；anchor_frame_align_en=true时可填UWB局部坐标。
      range_bias_m: 0.81 # 移动标签—入口基站固定设备对的测距正偏差，校正公式为raw-bias。
    - id: 0
      role: exit
      flag: 1
      position: [68.35, 0.0, 0.0]
      range_bias_m: 0.33 # 移动标签—出口基站固定设备对的测距正偏差，待独立标定后填写。
  tag_offset_body: [-0.12, 0.0, 0.12] # UWB标签相对FAST-LIVO body原点的杆臂，按body坐标轴填写，单位米。
  tag_offset_convergence_step_m: 1.0e-4 # 在线杆臂单步变化低于该值视为稳定样本。
  tag_offset_convergence_count: 20 # 连续稳定样本达到该数后输出最终杆臂。

lio:
  max_iterations: 3
  map_update_stride: 2 # 仅每2帧更新一次地图体素，优先实时定位（可降建图细节）
  icp_min_iterations: 1 # ICP最小迭代次数：至少做1次
  icp_early_stop_residual_ratio: 0.03 # 残差相对改善低于该阈值且已收敛时提前停止
  icp_max_rot_step_deg: 1.2 # ICP单次旋转更新上限（度），抑制异常匹配导致姿态突跳
  icp_max_trans_step_m: 0.20 # ICP单次平移更新上限（米），抑制”轨迹上天”
  dept_err: 0.02
  beam_err: 0.15
  min_eigen_value: 0.005 # 0.005
  voxel_size: 0.8
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 10
  sliding_thresh: 4
  long_term_visual_map_en: false # 关闭长期视觉地图，降低长期运行计算开销
  long_term_visual_max_voxels: 5000 # 长期视觉地图最大体素数，超过后会逐步裁剪以限制内存

adaptive_selector:
  en: false # 离线诊断时先处理每一帧图像，避免视觉地图断点；实时跑不动时再改true
  trans_thresh_min: 0.03
  trans_thresh_max: 0.08
  rot_thresh_min_deg: 0.4
  rot_thresh_max_deg: 1.0
  constraint_ratio_full: 0.2
  max_skip_frames: 1

runtime_guard:
  enable: false # 运行时超时保护开关：true时自动在超预算时降级并在稳定后恢复
  frame_time_budget_s: 0.06 # 预算每帧处理时间不超过多少ms

uav:
  imu_rate_odom: false
  gravity_align_en: true

gps:
  enable: false # GNSS总开关；true才启动GNSS串口读取。
  update_en: false # GNSS位置融合开关；实机确认串口、时间、坐标对齐和杆臂后再打开。

  source: "serial" # 当前实现走serial。
  serial_port: "/dev/ttyUSB0" # GNSS串口设备名，按目标电脑实际枚举修改。
  baudrate: 921600 # GNSS输出波特率，必须和设备配置一致。
  dtr: true # 部分USB串口需要拉高DTR才输出数据。
  rts: false # 部分USB串口硬件流控相关；无要求时保持false。

  parser_mode: "auto" # 自动解析KSXT、NMEA、AGRICA；legacy_imugnss_json仅兼容旧设备。
  primary_position_message: "KSXT" # KSXT有效时作为唯一主位置源。
  fallback_position_message: "GGA" # KSXT无可用位置时才允许GGA后备。
  time_offset_s: 0.0 # GNSS时间戳加到FAST-LIVO时间轴的偏移；GNSS滞后时通常需要调。
  # TODO(confirm): 实测GNSS输出频率后，再调match_threshold_s和stale_timeout_s。
  match_threshold_s: 0.10 # GNSS量测与LiDAR帧允许的最大时间差。
  stale_timeout_s: 0.50 # 超过该时间无新GNSS数据就认为数据过期。

  startup_convergence_s: 30.0 # 启动后等待GNSS收敛的最短时间。
  fixed_confirm_count: 10 # 连续固定解次数达到后才进入可用状态。
  reacquire_confirm_count: 5 # 失锁后重新确认固定解的连续次数。

  ksxt: # KSXT position_quality：0 invalid, 1 single, 2 RTK float, 4 RTK fixed。
    invalid_quality_values: [0]
    single_quality_values: [1]
    float_quality_values: [2]
    fixed_quality_values: [4]

  gga: # GGA quality：0 invalid, 1 single, 2 differential, 4 fixed, 5 float。
    invalid_quality_values: [0]
    single_quality_values: [1]
    differential_quality_values: [2]
    fixed_quality_values: [4]
    float_quality_values: [5]

  agrica: # AGRICA position_type：0 invalid, 1 single, 2 differential, 4 fixed, 5 float, 7 manual fixed。
    invalid_position_types: [0]
    single_position_types: [1]
    differential_position_types: [2]
    fixed_position_types: [4]
    float_position_types: [5]
    manual_fixed_position_types: [7]
    crc_check_en: false # 当前只记录AGRICA；CRC算法确认前不把它当NMEA两位XOR。

  fixed_only: true # true=只接受固定解；测试浮点解时才改false。

  origin_mode: "first_fixed" # first_fixed=第一帧固定解作ENU原点；manual=使用下面手填原点。
  origin_latitude_deg: 0.0 # manual模式下的原点纬度。
  origin_longitude_deg: 0.0 # manual模式下的原点经度。
  origin_altitude_m: 0.0 # manual模式下的原点高程。

  altitude_type: "ellipsoid" # ellipsoid=椭球高；orthometric=正常高，会加geoid_separation_m转椭球高。
  geoid_separation_m: 0.0 # 正常高到椭球高的改正量，仅altitude_type=orthometric时使用。

  frame_align_en: true # 自动估计GNSS ENU到FAST-LIVO世界系的2D yaw和平移。
  frame_align_mode: "trajectory_2d" # trajectory_2d=用运动轨迹自动对齐；manual=使用下面yaw/translation。
  frame_align_min_samples: 20 # 自动对齐至少需要的GNSS样本数。
  frame_align_min_motion_m: 10.0 # 自动对齐前轨迹至少要移动的距离。
  frame_align_max_rms_m: 0.50 # 自动对齐成功的RMS残差上限。
  frame_align_max_error_m: 1.50 # 自动对齐成功的最大单点误差上限。
  frame_align_freeze_after_success: true # 成功对齐后冻结外参，避免运行中漂移。

  frame_align_yaw_deg: 0.0 # manual模式下ENU到FAST-LIVO世界系的yaw角。
  frame_align_translation: [0.0, 0.0, 0.0] # manual模式下ENU到FAST-LIVO世界系的平移。

  update_xy_only: true # 默认只用GNSS约束水平位置。
  update_z: false # true会融合高度；高度源可靠且高程类型确认后再打开。
  update_orientation: false # 当前主流程不使用GNSS姿态更新，保持false。

  sigma_xy_fixed_m: 0.10 # 固定解水平标准差；越小越相信GNSS。
  sigma_z_fixed_m: 0.30 # 固定解高程标准差；仅update_z=true时明显影响。
  position_cov_floor_m: 0.20 # GNSS位置协方差下限，防止权重过大。

  chi2_gate_2d: 9.21 # 2D卡方门限；9.21约等于99%置信门。
  max_residual_m: 3.0 # GNSS残差硬门限，超过直接拒绝。
  max_update_step_m: 0.20 # 单次GNSS融合允许的最大位置修正。

  lever_arm_body_to_gnss: [0.0, 0.0, 0.0] # GNSS天线相位中心相对FAST-LIVO body原点的杆臂，单位米。

  pause_map_update_frames: 3 # GNSS大修正后暂停插入局部地图的帧数，减少错误地图写入。
  pause_map_update_min_correction_m: 0.05 # 修正量超过该值才触发暂停建图。

  raw_log_filename: "gnss_raw.txt" # 原始串口行日志，写到pcd_save/save_path。
  parsed_log_filename: "gnss_parsed.txt" # 解析后的GNSS量测日志。
  update_log_filename: "gnss_updates.txt" # 融合/拒绝结果日志。
  log_flush_stride: 1 # 每多少条日志flush一次；调大可减少IO但断电时更易丢尾部日志。

publish:
  dense_map_en: true
  pub_effect_point_en: true  # 已启用特征点可视化
  pub_plane_en: false
  pub_scan_num: 1
  publish_img_stride: 1 # 图像可视化降频
  blind_rgb_points: 0.0

debug:
  print_console_timing_en: true # 终端耗时表输出
  print_console_timing_stride: 1
  vio_console_timing_print_en: true
  vio_console_timing_print_stride: 1

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pos_output:
  enable_timestamp: true
  format: "timestamp_xyz_quat"

pcd_save:
  pcd_save_en: false
  save_log_en: true # 日志写盘
  save_path: "/home/gulu/data"
  global_map_pub: false   #need to set pcd_save_en true, x86上请设为false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.05
  max_cache_points: 40000 # 缓存点云硬上限（RGB或强度）
  interval: 10
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

udp_report:
  en: true
  device_id: "fast_livo2_001"
  target_ip: "127.0.0.1"
  target_port: 9000

aruco_landmarks:
  aruco_landmarks_en: false
  width: 0.8
  height: 0.6
  marker_size: 0.16
  delta_width_qr_center: 0.28 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.18 # Half the distance between the centers of two markers in the vertical direction
  markers:
