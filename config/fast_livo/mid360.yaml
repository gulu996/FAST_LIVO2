experimental_features:
  enable: false

common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
  sub_lidar_queue_size: 1000
  sub_imu_queue_size: 10000
  sub_img_queue_size: 1000
  max_lidar_buffer_size: 1000
  max_imu_buffer_size: 10000
  max_img_buffer_size: 1000
  max_prop_imu_buffer_size: 10000
  sync_img_buffer_min_size: 5
  sync_img_lookahead_time: 0.12

deterministic_debug:
  force_single_thread: false
  visual_update_serial_en: false
  lio_update_serial_en: false
  contiguous_image_copy_en: false
  lio_feature_sort_en: false
  visual_observed_voxel_sort_en: false

  state_snap_en: false
  camera_point_snap_en: false
  pixel_snap_en: false

  imu_accept_out_of_order_en: true
  imu_buffer_sort_en: true
  prop_imu_buffer_sort_en: true
  sync_wait_for_image_lookahead_en: true
  pending_vio_image_en: true
  visual_voxel_key_sort_en: true
  image_buffer_sort_en: true

