time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 2
  filter_size_surf: 0.25
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 4
  blind: 0.5

vio:
  max_iterations: 5 # 提高视觉EKF迭代次数，优先把可用帧跑起来
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  visual_map_prune_en: true
  visual_map_max_voxels: 1800 # 视觉体素硬上限；到上限后淘汰最早的非当前子图体素
  visual_map_max_points_per_voxel: 10 # 每个视觉体素最多保留点数；满后用新点替换更早的点
  visual_map_max_total_points: 20000 # 视觉点总量硬上限；满后按frame id淘汰最早的点
  visual_map_max_add_per_frame: 300 # 控制单帧新增点数量，适合Jetson长时间运行
  visual_map_min_shi_tomasi_score: 5.0 # 保留角点质量筛选，同时避免视觉地图长期只有少量可跟踪点
  min_retrieve_points: 15 # 至少跟踪15个视觉点才进入视觉EKF；兼顾更新频率与坏图保护
  min_update_meas: 300 # patch残差数量门限；跟踪点不足时仍会跳过状态更新
  low_track_force_update_stride: 0 # 关闭低跟踪强制VIO，避免坏图像靠少量点硬更新
  low_track_force_min_points: 12 # 备用参数；low_track_force_update_stride=0时不生效
  visual_update_guard_en: true # 视觉EKF总修正门限，超过则回滚到LIO/IMU预测，防止出口过曝导致突然倒退
  visual_update_max_trans_m: 0.12 # 收紧单帧视觉总平移修正上限，坏图导致的大跳变会回滚
  visual_update_max_rot_deg: 2.0 # 收紧单帧视觉总旋转修正上限
  visual_update_max_backward_m: 0.01 # 视觉更新后的最终位姿相对上一帧允许的反向步长硬上限，不限制VIO正常回拉LIO超前
  visual_update_max_backward_ratio: 0.08 # 最终位姿反向步长不能超过当前帧预测前进距离的比例
  visual_update_backward_abs_floor_m: 0.003 # 最终位姿反向步长动态阈值下限，避免低速时过度敏感
  visual_update_max_lateral_m: 0.08 # 垂直于速度方向的视觉修正硬上限
  visual_update_max_lateral_ratio: 0.35 # 横向修正不能超过当前帧预测前进距离的比例
  visual_update_max_exposure_delta: 0.30 # 曝光估计突变较大时回滚视觉更新
  image_quality_gate_en: true # 打开整帧质量门，过曝/过暗/低对比图像直接跳过VIO更新
  image_quality_max_saturated_fraction: 0.22 # 全图超过约22%接近白色才整帧跳过
  image_quality_max_tile_saturated_fraction: 0.90 # 单个小区域接近全白才整帧跳过；普通天空/灯光区域交给patch门处理
  image_quality_max_dark_fraction: 0.98 # 灰度<=阈值的像素比例超过该值认为画面近乎全黑
  image_quality_min_intensity_std: 6.0 # 只过滤接近无纹理的整帧图像
  visual_patch_quality_gate_en: true # 对单个视觉patch做过曝/低纹理过滤，处理出口刚出现时面积小、全图门限尚未触发的纯白区域
  visual_patch_max_saturated_fraction: 0.20 # 局部patch过曝时不参与跟踪/建图，不必因此丢弃整帧
  visual_patch_min_intensity_std: 2.5 # patch灰度标准差过低时不参与跟踪/建图
  image_quality_saturated_pixel_value: 245 # 更早识别接近过曝的像素
  image_quality_dark_pixel_value: 8
  image_quality_tile_rows: 6 # 更细的分块，更容易发现局部强光坏区
  image_quality_tile_cols: 6
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.8 # 0.2
  gyr_cov: 0.5 # 0.5
  b_acc_cov: 0.001 # 0.1
  b_gyr_cov: 0.001 # 0.1

uwb:
  en: true
  update_en: true

  # 数据来源：serial在线读串口；file离线从replay_file回放之前保存的uwb_ranges.txt
  source: "file" # serial在线读串口；file离线从replay_file读之前保存的uwb_ranges.txt
  replay_file: "/home/gulu/Downloads/uwb_ranges1.txt"
  replay_time_mode: "relative" # relative: UWB文件首行时间戳作为0，对齐rosbag开始播放；absolute: 按原始时间戳对齐/clock
  replay_speed: 2.0 # 未启用/use_sim_time时应与rosbag -r倍速一致；启用--clock和/use_sim_time时程序自动按1.0处理

  # 基站配置统一使用external_anchors：
  # 1) 入口/出口双基站：把入口设为[0,0,0]，出口设为[0,两基站距离,0]即可。
  # 2) 多基站且已知外部坐标：把对应anchor的flag设为1，并填写外部测量坐标。
  # position是外部anchor坐标系，不要求和FAST-LIVO2初始坐标系一致；
  # 程序会自动估计外部anchor坐标系到FAST-LIVO2局部坐标系的刚体变换。
  mode: "external_anchors"
  start_anchor_origin_en: false # true表示start_anchor_origin_id对应的UWB基站坐标为[0,0,0]且就是FAST-LIVO2起点；程序跳过anchor坐标系对齐，直接用anchors坐标做测距约束
  start_anchor_origin_id: 0 # start_anchor_origin_en=true时，该anchor必须启用且position接近[0,0,0]
  start_anchor_origin_tolerance_m: 0.20 # 起点anchor坐标与[0,0,0]允许的误差；超过则回退到普通anchor_frame_align流程
  # start_anchor_origin_en=true时：如果只信任起点基站，就只把起点anchor的flag设为1；其它anchor只有在坐标也属于FAST-LIVO2局部坐标系时才启用
  anchor_frame_align_start_id: 0 # 多基站时用于提供优化初值，双基站时用于直接对齐；建议选路线起点附近基站
  anchor_frame_align_end_id: 1 # 多基站时仅用于初值/回退；建议与start相距较远且总体方向接近路线方向
  anchors:
    - id: 0
      flag: 1 # 入口基站；启用该anchor并使用position参与UWB更新
      position: [0.0, 0.0, 0.0]
    - id: 1
      flag: 1 # 出口基站；这里178.0就是入口/出口两基站距离，单位米
      position: [0.0, 188.0, 0.0]
    - id: 2
      flag: 0 # 未使用的anchor保持0；多基站时改为1并填写外部坐标
      position: [0.0, 0.0, 0.0]
    - id: 3
      flag: 0
      position: [0.0, 0.0, 0.0]

  # 常用调参
  tag_offset_body: [0.0, 0.0, 0.0] # UWB天线相对IMU/body坐标系的位置
  init_min_motion_m: 150.0 # 估计入口-出口方向前至少运动的距离；有明显横移时可增大
  range_noise_m: 0.10
  position_cov_floor_m: 3.0 # UWB更新专用位置协方差下限；LIO/VIO过于自信导致UWB拉不动时增大，0表示关闭
  output_correction_en: true # true: UWB修正输出轨迹/odom，不直接移动局部地图坐标，避免下一帧LIO把修正拉回去
  output_smooth_en: true # true: UWB输出修正按帧平滑过渡，避免轨迹突然折线跳变
  output_smooth_alpha: 0.15 # 每帧向UWB目标修正量靠近的比例，越大越跟手，越小越平滑
  output_smooth_max_step_m: 0.05 # 每帧输出修正量最大变化，建议0.03~0.10；越小轨迹越平滑但收敛更慢
  max_residual_m: 6.0

  # 高级参数：通常不需要修改
  serial_port: "/dev/ttyUSB0"
  baudrate: 115200
  dtr: true
  rts: false
  log_filename: "uwb_ranges.txt" # 保存到当前save_path时间戳目录下
  log_flush_stride: 1 # 每几行刷新一次，1表示便于tail -f实时观察
  parser_mode: "distance" # 只识别distance[id],dist；UWBDBG可能重复打印上一次成功结果，默认不参与回放
  range_scale: 1.0 # 串口里若是cm填0.01，若是mm填0.001
  min_range_m: 0.05
  max_range_m: 250.0 # 入口/出口基站相距178m，远端测距不能用100m门限提前丢弃
  max_age_s: 5.0 # 离线relative倍速回放时允许少量调度滞后，避免误丢UWB replay数据
  max_queue_size: 512
  min_update_anchors: 1
  # 0.000或小于min_range_m的测距会在解析阶段直接忽略；正常重复距离不再额外丢弃
  update_max_rot_step_deg: 1.0
  update_max_trans_step_m: 0.20 # output_correction_en=true时可适当增大；只修正输出轨迹，不会直接破坏局部地图
  tag_offset_estimate_en: false # 可选在线估计UWB天线杆臂；需要anchor世界坐标有效且运动/观测充分
  tag_offset_estimate_min_anchors: 2
  tag_offset_init_cov_m: 0.10
  tag_offset_process_noise_m: 0.0 # 刚性安装建议为0；非0会允许杆臂缓慢变化
  tag_offset_update_max_step_m: 0.01
  tag_offset_max_norm_m: 1.0
  anchor_frame_align_min_motion_m: 150.0 # external_anchors模式下可单独覆盖init_min_motion_m；有先横移/换道时建议60~120
  anchor_frame_align_use_start_range_offset: true # 用起点到start anchor的第一条有效距离修正平移
  anchor_frame_align_yaw_only: true # 只对齐平面航向，假设外部坐标和FAST-LIVO2都以重力为Z轴，避免高度噪声引入倾斜
  anchor_frame_align_multi_en: true # 启用多基站联合对齐；达到下面基站数量后，不再只依赖start/end两点
  anchor_frame_align_multi_min_anchors: 3 # 至少多少个已启用且有足够测距样本的基站才使用联合优化
  anchor_frame_align_multi_max_rmse_m: 3.0 # 去除最差20%样本后的RMSE上限，超过时继续等待更多数据
  anchor_position_estimate_en: false # 通常保持false；flag=0 anchor自由3D估计在隧道/近似直线运动下歧义很大
  anchor_estimate_use_for_update: true
  anchor_estimate_freeze_after_init: true
  anchor_estimate_min_samples: 30
  anchor_estimate_max_samples: 300
  anchor_estimate_min_rank: 1 # 3D充分运动建议3；隧道近似直线可降到1/2，但3D位置会有歧义
  anchor_estimate_min_motion_m: 1.0
  anchor_estimate_max_rmse_m: 2.0
  anchor_estimate_max_step_m: 0.0 # 0表示不限制GN单步，避免几十米外的anchor被2m步长卡住

lio:
  max_iterations: 3
  map_update_stride: 2 # 仅每2帧更新一次地图体素，优先实时定位（可降建图细节）
  icp_min_iterations: 1 # ICP最小迭代次数：至少做1次
  icp_early_stop_residual_ratio: 0.03 # 残差相对改善低于该阈值且已收敛时提前停止
  icp_max_rot_step_deg: 1.2 # ICP单次旋转更新上限（度），抑制异常匹配导致姿态突跳
  icp_max_trans_step_m: 0.20 # ICP单次平移更新上限（米），抑制”轨迹上天”
  dept_err: 0.02
  beam_err: 0.15
  min_eigen_value: 0.005 # 0.005
  voxel_size: 0.8
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: true
  half_map_size: 100
  sliding_thresh: 4
  long_term_visual_map_en: false # 关闭长期视觉地图，降低长期运行计算开销
  long_term_visual_max_voxels: 5000 # 长期视觉地图最大体素数，超过后会逐步裁剪以限制内存

adaptive_selector:
  en: false # 离线诊断时先处理每一帧图像，避免视觉地图断点；实时跑不动时再改true
  trans_thresh_min: 0.03
  trans_thresh_max: 0.08
  rot_thresh_min_deg: 0.4
  rot_thresh_max_deg: 1.0
  constraint_ratio_full: 0.2
  max_skip_frames: 1

runtime_guard:
  enable: false # 运行时超时保护开关：true时自动在超预算时降级并在稳定后恢复
  frame_time_budget_s: 0.06 # 预算每帧处理时间不超过多少ms

uav:
  imu_rate_odom: false
  gravity_align_en: true

publish:
  dense_map_en: true
  pub_effect_point_en: true  # 已启用特征点可视化
  pub_plane_en: false
  pub_scan_num: 1
  publish_img_stride: 1 # 图像可视化降频
  blind_rgb_points: 0.0

debug:
  print_console_timing_en: true # 终端耗时表输出
  print_console_timing_stride: 1
  vio_console_timing_print_en: true
  vio_console_timing_print_stride: 1

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  save_log_en: true # 日志写盘
  save_path: "/home/gulu/data"
  global_map_pub: false   #need to set pcd_save_en true, x86上请设为false
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.05
  max_cache_points: 40000 # 缓存点云硬上限（RGB或强度）
  interval: 10
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

udp_report:
  en: true
  device_id: "fast_livo2_001"
  target_ip: "127.0.0.1"
  target_port: 9000

aruco_landmarks:
  aruco_landmarks_en: false
  width: 0.8
  height: 0.6
  marker_size: 0.16
  delta_width_qr_center: 0.28 # Half the distance between the centers of two markers in the horizontal direction 
  delta_height_qr_center: 0.18 # Half the distance between the centers of two markers in the vertical direction
  process_stride: 4 # 每隔多少个视觉帧执行一次ArUco检测和状态更新；1表示每帧执行
  markers:
    - id: 1
      flag: 0      #0表示该地标的世界坐标无效
      #position: [1.0, 2.0, 1.5]
    - id: 2
      flag: 0
      #position: [10.0, 2.0, 1.5]
    - id: 3
      flag: 0
      #position: [20.0, 2.0, 1.5]
    - id: 4
      flag: 0
      #position: [30.0, 2.0, 1.5]
    
